<svg width="128" height="128" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vacate">
  <title>Vacate</title>

  <!--
    Знак: буква V, правая ветвь которой обрывается и рассыпается вверх наружу.
    Целая ветвь — то, что остаётся; распадающаяся — освобождённое место.

    Осколки уходят ВВЕРХ И ВПРАВО, за пределы буквы, а не внутрь: в первом варианте
    они летели к нижней вершине, налезали на левую ветвь и превращали знак в галочку.
    Проверено отрисовкой в размерах от 128 до 16 пикселей.

    Геометрия жёсткая, без градиентов: инструмент, удаляющий данные, должен выглядеть
    строгим, а не нарядным.
  -->

  <rect width="64" height="64" rx="14" fill="#16171B"/>

  <!-- Левая ветвь: целая, от верха к нижней вершине -->
  <path d="M15 12 L32 50" stroke="#F2F3F5" stroke-width="8" stroke-linecap="square"/>

  <!-- Правая ветвь растёт от вершины вверх и обрывается на середине -->
  <path d="M32 50 L40 32" stroke="#E63329" stroke-width="8" stroke-linecap="square"/>

  <!-- Осколки продолжают ту же ось вверх и вправо, уходя из буквы -->
  <rect x="38.4" y="22.6" width="8" height="8" fill="#E63329"/>
  <rect x="42.8" y="14.4" width="6" height="6" fill="#E63329" opacity="0.7"/>
  <rect x="46.4" y="7.6" width="4" height="4" fill="#E63329" opacity="0.4"/>
</svg>
