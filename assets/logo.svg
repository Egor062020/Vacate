<svg width="128" height="128" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PurgeX">
  <title>PurgeX</title>

  <!--
    Знак строится на одной идее: X, у которого одна ветвь обрывается и уносится осколками.
    Целая диагональ — то, что остаётся нетронутым; распадающаяся — то, что вычищено.
    Геометрия жёсткая, без градиентов и свечения: инструмент, удаляющий данные,
    должен выглядеть строгим, а не нарядным.

    Размеры подобраны по проверке в реальных размерах: знак занимает почти всё поле,
    штрихи толстые, осколков всего три. Более мелкие детали на 16 пикселях
    превращались в грязь и читаемость только портили.
  -->

  <rect width="64" height="64" rx="14" fill="#16171B"/>

  <!-- Целая диагональ -->
  <path d="M15 15 L49 49" stroke="#F2F3F5" stroke-width="8" stroke-linecap="square"/>

  <!-- Вторая диагональ обрывается на середине -->
  <path d="M49 15 L37 27" stroke="#E63329" stroke-width="8" stroke-linecap="square"/>

  <!-- Осколки: убывающий ряд по той же оси -->
  <rect x="24.5" y="32.5" width="8" height="8" fill="#E63329"/>
  <rect x="16.5" y="40.5" width="6" height="6" fill="#E63329" opacity="0.7"/>
  <rect x="10.5" y="47.5" width="4" height="4" fill="#E63329" opacity="0.4"/>
</svg>
