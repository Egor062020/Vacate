<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vacate">
  <title>Vacate</title>

  <!--
    Версия для мелких размеров (16-24 пикселя): панель задач, системный лоток, вкладка браузера.
    Осколок оставлен один: ряд убывающих квадратов на таком размере сливается в грязь.
    Остаётся различимое — целая ветвь и оборванная красная.
  -->

  <rect width="16" height="16" rx="3" fill="#16171B"/>
  <path d="M3.8 3 L8 12.4" stroke="#F2F3F5" stroke-width="2.4" stroke-linecap="square"/>
  <path d="M8 12.4 L10 7.8" stroke="#E63329" stroke-width="2.4" stroke-linecap="square"/>
  <rect x="9.8" y="3.4" width="2.6" height="2.6" fill="#E63329"/>
</svg>
